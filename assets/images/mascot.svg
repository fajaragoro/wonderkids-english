    <!-- bayangan -->
    <ellipse cx="100" cy="228" rx="48" ry="8" fill="#2b1f5c" opacity=".15" stroke="none"/>
    <!-- ransel -->
    <rect x="58" y="124" width="84" height="62" rx="18" fill="#c47d2e"/>
    <!-- kaki & sepatu -->
    <rect x="76" y="186" width="18" height="26" rx="6" fill="#5b4b8a"/>
    <rect x="106" y="186" width="18" height="26" rx="6" fill="#5b4b8a"/>
    <path d="M70 214 q0 -10 12 -10 h12 v14 h-24 z" fill="#8b5a3c"/>
    <path d="M130 214 q0 -10 -12 -10 h-12 v14 h24 z" fill="#8b5a3c"/>
    <!-- badan / baju -->
    <path d="M66 140 q0 -18 18 -18 h32 q18 0 18 18 v48 h-68 z" fill="#2fd07d"/>
    <!-- lengan terangkat (ceria) -->
    <path d="M68 142 q-22 -6 -28 -30" fill="none" stroke-width="11.9"/>
    <path d="M68 142 q-22 -6 -28 -30" fill="none" stroke="#2fd07d" stroke-width="6"/>
    <circle cx="40" cy="108" r="9" fill="#ffd2ac"/>
    <path d="M132 142 q22 -6 28 -30" fill="none" stroke-width="11.9"/>
    <path d="M132 142 q22 -6 28 -30" fill="none" stroke="#2fd07d" stroke-width="6"/>
    <circle cx="160" cy="108" r="9" fill="#ffd2ac"/>
    <!-- tali ransel -->
    <path d="M82 124 v40 M118 124 v40" fill="none" stroke="#8b5a3c" stroke-width="6"/>
    <!-- bintang di baju -->
    <path d="M100 150 l4 8 9 1 -7 6 2 9 -8 -5 -8 5 2 -9 -7 -6 9 -1z" fill="#ffc928" stroke-width="2.5"/>
    <!-- kepala (tanpa wajah) -->
    <circle cx="100" cy="82" r="42" fill="#ffd2ac"/>
    <!-- topi petualang -->
    <path d="M56 78 q0 -44 44 -44 q44 0 44 44 z" fill="#ffc928"/>
    <path d="M48 80 q52 -12 104 0 q-52 10 -104 0 z" fill="#ff8a2a"/>
    <path d="M100 40 q12 -10 18 2 q-12 8 -18 -2 z" fill="#2fd07d" stroke-width="2.5"/>
  </g>
  <!-- kilau topi -->
  <path d="M72 58 q8 -12 20 -14" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" opacity=".8"/>
</g></svg>
