<svg data-style="2d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Wondi, maskot Wonder Kids"><defs><filter id="s2d" x="-5%" y="-5%" width="110%" height="110%"><feOffset in="SourceAlpha" dx="-5.0" dy="-3.5" result="a"/><feComposite in="SourceAlpha" in2="a" operator="out" result="edgeS"/><feFlood flood-color="#2b1f5c" flood-opacity=".2"/><feComposite in2="edgeS" operator="in" result="shadow"/><feOffset in="SourceAlpha" dx="3.0" dy="2.5" result="b"/><feComposite in="SourceAlpha" in2="b" operator="out" result="edgeH"/><feFlood flood-color="#ffffff" flood-opacity=".3"/><feComposite in2="edgeH" operator="in" result="hi"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shadow"/><feMergeNode in="hi"/></feMerge></filter></defs><g filter="url(#s2d)">
  <!-- Wondi: maskot faceless (tanpa mata, hidung, mulut, alis). Ekspresi lewat pose. -->
