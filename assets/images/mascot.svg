<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Wondi, maskot Wonder Kids">
  <!-- Wondi: maskot faceless (tanpa mata, hidung, mulut, alis). Ekspresi lewat pose. -->
  <g stroke="#1c1b33" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- bayangan -->
    <ellipse cx="100" cy="228" rx="48" ry="8" fill="#1c1b33" opacity=".15" stroke="none"/>
    <!-- ransel -->
    <rect x="58" y="124" width="84" height="62" rx="18" fill="#c47d2e"/>
    <!-- kaki & sepatu -->
    <rect x="76" y="186" width="18" height="26" rx="6" fill="#5b4b8a"/>
    <rect x="106" y="186" width="18" height="26" rx="6" fill="#5b4b8a"/>
    <path d="M70 214 q0 -10 12 -10 h12 v14 h-24 z" fill="#8b5a3c"/>
    <path d="M130 214 q0 -10 -12 -10 h-12 v14 h24 z" fill="#8b5a3c"/>
    <!-- badan / baju -->
    <path d="M66 140 q0 -18 18 -18 h32 q18 0 18 18 v48 h-68 z" fill="#38cf8a"/>
    <!-- lengan terangkat (ceria) -->
    <path d="M68 142 q-22 -6 -28 -30" fill="none" stroke-width="14"/>
    <path d="M68 142 q-22 -6 -28 -30" fill="none" stroke="#38cf8a" stroke-width="7"/>
    <circle cx="40" cy="108" r="9" fill="#ffd9b3"/>
    <path d="M132 142 q22 -6 28 -30" fill="none" stroke-width="14"/>
    <path d="M132 142 q22 -6 28 -30" fill="none" stroke="#38cf8a" stroke-width="7"/>
    <circle cx="160" cy="108" r="9" fill="#ffd9b3"/>
    <!-- tali ransel -->
    <path d="M82 124 v40 M118 124 v40" fill="none" stroke="#8b5a3c" stroke-width="7"/>
    <!-- bintang di baju -->
    <path d="M100 150 l4 8 9 1 -7 6 2 9 -8 -5 -8 5 2 -9 -7 -6 9 -1z" fill="#ffd23f" stroke-width="3"/>
    <!-- kepala (tanpa wajah) -->
    <circle cx="100" cy="82" r="42" fill="#ffd9b3"/>
    <!-- topi petualang -->
    <path d="M56 78 q0 -44 44 -44 q44 0 44 44 z" fill="#ffd23f"/>
    <path d="M48 80 q52 -12 104 0 q-52 10 -104 0 z" fill="#ff9345"/>
    <path d="M100 40 q12 -10 18 2 q-12 8 -18 -2 z" fill="#38cf8a" stroke-width="3"/>
  </g>
  <!-- kilau topi -->
  <path d="M72 58 q8 -12 20 -14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
</svg>
